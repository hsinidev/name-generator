    <style>
      /* Galaxy Background Animation */
      body {
        background-color: #050505;
        overflow-x: hidden;
      }
      
      .galaxy-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        overflow: hidden;
      }

      .stars {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        box-shadow: 
          120px 500px #FFF, 
          500px 200px #FFF, 
          800px 100px #FFF,
          100px 50px #FFF,
          600px 300px #FFF,
          900px 600px #FFF,
          300px 400px #FFF;
        animation: animStar 50s linear infinite;
        opacity: 0.6;
      }

      .stars::after {
        content: " ";
        position: absolute;
        top: 2000px;
        width: 100%;
        height: 100%;
        background: transparent;
        box-shadow: 
          120px 500px #FFF, 
          500px 200px #FFF, 
          800px 100px #FFF,
          100px 50px #FFF,
          600px 300px #FFF,
          900px 600px #FFF,
          300px 400px #FFF;
      }

      .nebula {
        position: absolute;
        top: -20%;
        left: -20%;
        width: 140%;
        height: 140%;
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(76, 29, 149, 0.4), transparent 60%),
          radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.3), transparent 50%),
          radial-gradient(circle at 20% 80%, rgba(236, 72, 153, 0.3), transparent 50%);
        filter: blur(60px);
        animation: rotateNebula 60s linear infinite;
        z-index: -1;
      }

      @keyframes animStar {
        from { transform: translateY(0px); }
        to { transform: translateY(-2000px); }
      }

      @keyframes rotateNebula {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .modal-content-animation {
        animation: fadeIn 0.3s ease-out forwards;
      }
      
      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1f2937; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280; 
      }
    </style>
